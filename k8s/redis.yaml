---
# Redis — pub/sub + message tracking per card #9
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: insure-me
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# ClusterIP Service
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: insure-me
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379